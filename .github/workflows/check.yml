name: check

# Runs on every push and pull request. There was no CI at all before this, so
# the tests that guard the payout arithmetic only ran when somebody remembered
# to run them.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the droplet, so a pass here means a pass there. Type
          # stripping needs 22.6 or later.
          node-version: "22"
          cache: npm

      # The Prisma client is generated by postinstall and the type check needs
      # it, so a plain install is enough.
      - run: npm ci

      - name: encoding
        run: npm run check:encoding

      - name: types
        run: npx tsc --noEmit

      - name: tests
        run: npm test

      - name: lint
        run: npm run lint
        # The repository has pre-existing lint findings; surfacing them without
        # failing the build keeps this honest until they are dealt with.
        continue-on-error: true
